name: CI — Type Check, Currency & Boundary Tests

on:
  pull_request:
    branches: [ dev, master ]
  workflow_dispatch:

jobs:
  # ─── Job 1: Type Check + Currency Hygiene (SQLite fast path) ───────────────
  check:
    name: Type Check & Currency Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build database workspace
        run: npm run build --workspace=database

      - name: TypeScript — frontend (noEmit)
        run: npx tsc --noEmit -p frontend/tsconfig.json

      - name: TypeScript — backend (noEmit)
        run: npx tsc --noEmit -p backend/tsconfig.json

      - name: Currency hygiene check
        run: |
          # check:currency is introduced in feat/currency-foundation.
          # On earlier branches (e.g. ui/remove-fake-data) the script does not exist yet;
          # skip gracefully so CI is green and the gate is enforced from foundation onwards.
          if npm run 2>/dev/null | grep -q "check:currency"; then
            npm run check:currency
          else
            echo "::notice::check:currency not yet defined on this branch — skipping (expected on feat/currency-foundation and above)"
          fi

  # ─── Job 2: Currency Boundary Tests (SQLite) ───────────────────────────────
  currency-sqlite:
    name: Currency Boundary Tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build database workspace
        run: npm run build --workspace=database

      - name: Run migrations (SQLite)
        env:
          USE_SQLITE: "true"
        run: npx sequelize-cli db:migrate --config database/config/config.js

      - name: Run currency boundary test suite (SQLite)
        env:
          USE_SQLITE: "true"
        run: |
          # testCurrencyEnginePhase6.ts is introduced in feat/currency-approval-logic.
          # Skip gracefully on earlier branches so the stack can merge in order.
          TEST_FILE="backend/src/scripts/testCurrencyEnginePhase6.ts"
          if [ -f "$TEST_FILE" ]; then
            npx ts-node --project backend/tsconfig.json \
              "$TEST_FILE" 2>&1 | tee currency_sqlite.log
            echo "### Currency Boundary Tests (SQLite)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat currency_sqlite.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "::notice::testCurrencyEnginePhase6.ts not yet present — skipping (expected on feat/currency-approval-logic and above)"
          fi

  # ─── Job 3: Currency Migrations + Boundary Tests (Postgres 16) ─────────────
  currency-postgres:
    name: Currency Boundary Tests (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus_ci
          POSTGRES_PASSWORD: nexus_ci_pass
          POSTGRES_DB: nexus_crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build database workspace
        run: npm run build --workspace=database

      - name: Run all migrations (Postgres 16)
        env:
          DATABASE_URL: postgresql://nexus_ci:nexus_ci_pass@localhost:5432/nexus_crm_ci
          USE_SQLITE: "false"
        run: npx sequelize-cli db:migrate --config database/config/config.js

      - name: Verify migration DOWN paths (Postgres 16)
        env:
          DATABASE_URL: postgresql://nexus_ci:nexus_ci_pass@localhost:5432/nexus_crm_ci
          USE_SQLITE: "false"
        run: |
          # Roll back the 4 currency migrations one at a time then re-apply (from feat/currency-foundation onwards)
          if [ -f "database/migrations/20260924000000-create-org-settings.js" ]; then
            for i in 1 2 3 4; do
              npx sequelize-cli db:migrate:undo --config database/config/config.js
            done
            npx sequelize-cli db:migrate --config database/config/config.js
          else
            echo "::notice::Currency migrations not yet present on this branch — skipping currency down-path verification"
          fi

      - name: Run currency boundary test suite (Postgres 16)
        env:
          DATABASE_URL: postgresql://nexus_ci:nexus_ci_pass@localhost:5432/nexus_crm_ci
          USE_SQLITE: "false"
        run: |
          TEST_FILE="backend/src/scripts/testCurrencyEnginePhase6.ts"
          if [ -f "$TEST_FILE" ]; then
            npx ts-node --project backend/tsconfig.json \
              "$TEST_FILE" 2>&1 | tee currency_pg.log
            echo "### Currency Boundary Tests (Postgres 16)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat currency_pg.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "::notice::testCurrencyEnginePhase6.ts not yet present — skipping (expected on feat/currency-approval-logic and above)"
            touch currency_pg.log
          fi

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: currency-test-logs-pg16
          path: currency_pg.log
          if-no-files-found: ignore

